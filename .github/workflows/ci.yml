name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql+psycopg://kairos:kairos@localhost:5432/kairos
  REDIS_URL: redis://localhost:6379/0
  CURSOR_SECRET: ci-cursor-secret-not-for-production

jobs:
  api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        run: uv run ruff format --check .
      - working-directory: apps/api
        run: uv run ruff check .
      - working-directory: apps/api
        run: uv run mypy app

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        run: uv run alembic -c alembic.ini upgrade head
      - working-directory: apps/api
        run: uv run pytest --cov-report=xml

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - name: Migrate up, down, up
        working-directory: apps/api
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base
          uv run alembic -c alembic.ini upgrade head
      # Remplace un `diff` de `pg_dump` exécuté avec `|| true`, qui ne pouvait
      # rien détecter : il opposait deux styles d'écriture, et surtout deux
      # objets différents — le schéma initial d'un côté, l'état après toutes
      # les migrations de l'autre.
      - name: L'ORM reflète-t-il le schéma migré ?
        working-directory: apps/api
        run: uv run alembic -c alembic.ini check
      - name: Le schéma migré correspond-il à l'instantané committé ?
        working-directory: apps/api
        run: uv run pytest tests/integration/test_schema_snapshot.py -q --no-cov

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        run: uv run python -m app.export_openapi /tmp/openapi.json
      - name: Fail on OpenAPI diff
        run: diff -u packages/contracts/openapi.json /tmp/openapi.json

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kairos/web lint
      - run: pnpm --filter @kairos/web typecheck
      - run: pnpm --filter @kairos/web test
      - run: pnpm --filter @kairos/web build

  # Le parcours « Import assisté Catawiki », joué dans un vrai navigateur.
  #
  # Séparé de `web-quality` parce qu'il lui faut la pile entière : base, cache,
  # API et interface construite. C'est le prix d'une vérification que ni les
  # tests d'API ni les tests client ne peuvent rendre — un import juste côté
  # serveur mais qui n'atteint pas l'écran ne sert à rien.
  browser-journey:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_EMAIL: essai@kairos.local
      E2E_PASSWORD: mot-de-passe-essai-suffisamment-long
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        run: uv run alembic -c alembic.ini upgrade head
      - name: Compte d'essai
        working-directory: apps/api
        run: |
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy.ext.asyncio import async_sessionmaker, create_async_engine
          from app.identity.application.authentication import create_user
          async def main():
              engine = create_async_engine(
                  "postgresql+psycopg://kairos:kairos@localhost:5432/kairos"
              )
              async with async_sessionmaker(bind=engine)() as session:
                  await create_user(
                      session,
                      email="essai@kairos.local",
                      password="mot-de-passe-essai-suffisamment-long",
                  )
              await engine.dispose()
          asyncio.run(main())
          PY
      - name: API
        working-directory: apps/api
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
      - run: pnpm --filter @kairos/web build
      - name: Interface
        working-directory: apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          pnpm start &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/connexion && break
            sleep 1
          done
      # Le navigateur est téléchargé ici : l'exécuteur GitHub n'en fournit pas.
      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: apps/web
        run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-navigateur
          path: apps/web/test-results/
          retention-days: 7

  # Les images de production, construites et **démarrées** telles qu'elles
  # seront déployées.
  #
  # Ajouté après le premier déploiement réel des lots 1 et 2, qui a livré un
  # site en erreur 502 alors que tous les autres contrôles étaient verts :
  #
  #   - l'API importait `httpx`, déclaré seulement parmi les outils de test.
  #     Les jobs ci-dessus installent `--extra dev` : ils voyaient la
  #     bibliothèque. L'image, installée `--no-dev`, non ;
  #   - l'interface démarrait par `pnpm`, dont la version n'est pas fixée. Une
  #     version plus récente a tenté de réinstaller `node_modules` sous un
  #     utilisateur sans droit d'écriture, et le conteneur redémarrait en boucle.
  #
  # Aucun des deux défauts n'est dans le code testé : ils sont dans l'image, et
  # seul démarrer l'image les montre.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire les images
        run: |
          docker build -f infra/docker/api.Dockerfile -t kairos-api-ci .
          docker build -f infra/docker/web.Dockerfile -t kairos-web-ci .
      # Pas de base ni de cache : l'application doit démarrer et répondre à la
      # santé sans eux. Les dépendances de production suffisent, ou non.
      - name: L'API démarre-t-elle avec les seules dépendances de production ?
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:1/x \
            -e REDIS_URL=redis://127.0.0.1:1/0 \
            -e CURSOR_SECRET=ci-cursor-secret-not-for-production \
            -e ENVIRONMENT=production \
            -e 'CORS_ALLOWED_ORIGINS=["https://ci.invalid"]' \
            kairos-api-ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs api; exit 1; fi
          echo "API : démarrée, santé répond."
      # L'utilisateur est celui de l'image (`node`), sans droit d'écriture : c'est
      # la condition qui a fait échouer le démarrage.
      - name: L'interface démarre-t-elle sous l'utilisateur non privilégié ?
        run: |
          docker run -d --name web --network host kairos-web-ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/connexion; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs web; exit 1; fi
          echo "Interface : démarrée sous $(docker exec web id -un), /connexion répond."

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - name: pip-audit
        working-directory: apps/api
        run: uvx pip-audit || true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
