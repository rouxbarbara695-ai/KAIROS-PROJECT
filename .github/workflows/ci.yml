name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql+psycopg://kairos:kairos@localhost:5432/kairos
  REDIS_URL: redis://localhost:6379/0

jobs:
  api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        run: uv run ruff format --check .
      - working-directory: apps/api
        run: uv run ruff check .
      - working-directory: apps/api
        run: uv run mypy app

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        run: uv run alembic -c alembic.ini upgrade head
      - working-directory: apps/api
        run: uv run pytest --cov-report=xml

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - name: Migrate up, down, up
        working-directory: apps/api
        run: |
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini downgrade base
          uv run alembic -c alembic.ini upgrade head
      - name: Compare schema with database/schema.sql
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=kairos pg_dump -h localhost -U kairos -d kairos --schema-only --no-owner --no-privileges > /tmp/dumped.sql
          echo "Comparaison informative — le contrat canonique est database/schema.sql"
          diff -u database/schema.sql /tmp/dumped.sql || true

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - working-directory: apps/api
        run: uv run python -m app.export_openapi /tmp/openapi.json
      - name: Fail on OpenAPI diff
        run: diff -u packages/contracts/openapi.json /tmp/openapi.json

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kairos/web lint
      - run: pnpm --filter @kairos/web typecheck
      - run: pnpm --filter @kairos/web build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: apps/api
        run: uv sync --extra dev
      - name: pip-audit
        working-directory: apps/api
        run: uvx pip-audit || true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
