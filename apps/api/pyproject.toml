[project]
name = "kairos-api"
version = "0.1.0"
description = "KAIROS API — moteur de décision achat-revente de montres"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008 : FastAPI utilise intentionnellement Depends(...) en valeur par défaut.
ignore = ["B008"]

[tool.mypy]
strict = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
  "integration: requires a real PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy async utilise greenlet pour appeler le driver DBAPI synchrone ;
# sans ce réglage, coverage sous-évalue silencieusement le code exécuté
# après un `await session.execute(...)`.
concurrency = ["greenlet"]
