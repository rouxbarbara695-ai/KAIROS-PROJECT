name: kairos

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "5432:5432"
    volumes:
      - kairos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://kairos:kairos@postgres:5432/kairos
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Le service `worker` a été retiré : il lançait `python -m app.worker`, un
  # module qui n'existe pas. Il échouait donc à chaque démarrage de la pile.
  # Il reviendra avec la surveillance automatisée (KAI-405), qui est
  # conditionnelle et soumise à validation écrite du mode d'accès.

  web:
    build:
      # La racine du dépôt, pas `apps/web` : l'interface dépend de
      # `@kairos/contracts` par un lien d'espace de travail pnpm.
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  kairos_postgres_data:
